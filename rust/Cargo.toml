[package]
name = "hallmark-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

[workspace]
members = ["cli"]
resolver = "3"

[dependencies]
crc32fast = "1.5"
serde = { version = "1.0", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
